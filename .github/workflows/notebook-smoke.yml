name: Execute participant notebooks

on:
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * 1"
  push:
    branches: [main]
    paths:
      - "notebooks/**"
      - "data/**"
      - "requirements-lock.txt"
      - "scripts/execute_notebooks_offline.py"
      - ".github/workflows/notebook-smoke.yml"

permissions:
  contents: read

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      TF_CPP_MIN_LOG_LEVEL: "2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked environment and notebook runner
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install nbformat==5.10.4 nbclient==0.10.2 ipykernel==6.30.1
      - name: Execute all participant notebooks with bundled recovery data
        run: python scripts/execute_notebooks_offline.py
